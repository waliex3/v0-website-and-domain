<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World Motion Graphic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      width: 1920px;
      height: 1080px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Background radial glow */
    .glow-bg {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      opacity: 0;
      animation: glowIn 1.2s ease-out 0.3s forwards;
    }

    /* Particle ring */
    .ring {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      border: 1px solid rgba(99, 102, 241, 0.25);
      opacity: 0;
      animation: ringExpand 2s ease-out 0.8s forwards;
    }

    .ring:nth-child(2) {
      animation-delay: 1.2s;
      border-color: rgba(168, 85, 247, 0.2);
    }

    /* Main text wrapper */
    .text-wrapper {
      position: relative;
      z-index: 10;
      text-align: center;
    }

    /* "Hello" line */
    .hello {
      display: block;
      font-size: 96px;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      opacity: 0;
      transform: translateY(-30px) scale(0.85);
      animation: fadeScaleIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    /* "World" line */
    .world {
      display: block;
      font-size: 180px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 40%, #c084fc 70%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      transform: scale(0.7);
      animation: wordBurst 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
    }

    /* Underline accent */
    .underline {
      width: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #a5b4fc, #c084fc, transparent);
      margin: 16px auto 0;
      border-radius: 2px;
      animation: lineGrow 0.9s ease-out 2s forwards;
    }

    /* Tagline */
    .tagline {
      margin-top: 28px;
      font-size: 22px;
      letter-spacing: 0.25em;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 1s ease-out 2.6s forwards;
    }

    /* Floating particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(165, 180, 252, 0.6);
      animation: float linear infinite;
    }

    /* Corner decorations */
    .corner {
      position: absolute;
      width: 60px;
      height: 60px;
      opacity: 0;
      animation: cornerFade 0.8s ease-out 3s forwards;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: rgba(165, 180, 252, 0.4);
    }
    .corner::before { width: 100%; height: 1px; top: 0; left: 0; }
    .corner::after  { width: 1px; height: 100%; top: 0; left: 0; }
    .corner.tr { top: 80px; right: 80px; transform: rotate(90deg); }
    .corner.bl { bottom: 80px; left: 80px; transform: rotate(270deg); }
    .corner.tl { top: 80px; left: 80px; }
    .corner.br { bottom: 80px; right: 80px; transform: rotate(180deg); }

    /* Keyframes */
    @keyframes glowIn {
      to { opacity: 1; }
    }

    @keyframes ringExpand {
      0%  { opacity: 0; transform: scale(0.5); }
      50% { opacity: 0.7; }
      100%{ opacity: 0; transform: scale(2.2); }
    }

    @keyframes fadeScaleIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes wordBurst {
      0%  { opacity: 0; transform: scale(0.7); filter: blur(20px); }
      60% { opacity: 1; transform: scale(1.04); filter: blur(0); }
      100%{ opacity: 1; transform: scale(1); filter: blur(0); }
    }

    @keyframes lineGrow {
      to { width: 520px; }
    }

    @keyframes fadeUp {
      0%  { opacity: 0; transform: translateY(12px); }
      100%{ opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-400px) translateX(var(--drift)) scale(0.4); opacity: 0; }
    }

    @keyframes cornerFade {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="glow-bg"></div>
    <div class="ring"></div>
    <div class="ring"></div>

    <!-- Corner decorations -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- Main text -->
    <div class="text-wrapper">
      <span class="hello">Hello</span>
      <span class="world">World</span>
      <div class="underline"></div>
      <p class="tagline">Motion Graphic &nbsp;·&nbsp; 2026</p>
    </div>
  </div>

  <script>
    // Generate floating particles
    const scene = document.querySelector('.scene');
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 4 + 2;
      const x = Math.random() * 100;
      const y = 60 + Math.random() * 40;
      const duration = 4 + Math.random() * 6;
      const delay = Math.random() * 8;
      const drift = (Math.random() - 0.5) * 120;
      p.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        left: ${x}%;
        top: ${y}%;
        --drift: ${drift}px;
        animation-duration: ${duration}s;
        animation-delay: ${delay}s;
      `;
      scene.appendChild(p);
    }
  </script>
</body>
</html>
